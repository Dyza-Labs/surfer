services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: surfer
      POSTGRES_PASSWORD: surfer
      POSTGRES_DB: surfer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surfer"]
      interval: 2s
      timeout: 2s
      retries: 15

  app:
    build: .
    env_file: .env
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: